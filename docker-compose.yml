services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: contable_user
      POSTGRES_PASSWORD: contable_pass
      POSTGRES_DB: contable_db
    ports:
      - "5433:5432"
    volumes:
      - contable_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contable_user -d contable_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://contable_user:contable_pass@db:5432/contable_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-cambiar-en-produccion}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    ports:
      - "8001:8000"

volumes:
  contable_pgdata:
